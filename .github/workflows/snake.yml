name: SnakeGame

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/cobrinha.svg?color_snake=#FF4D6D&color_dots=#ebedf0,#d9d1ff,#b3a3ff,#8B6CFF,#5536D9
            dist/cobrinha-dark.svg?palette=github-dark&color_snake=#FF4D6D&color_dots=#171B30,#2E2468,#4B35A8,#6E52E8,#9D86FF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
